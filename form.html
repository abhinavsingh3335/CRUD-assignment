<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Name</title>
<style>
  body {
    font-family: Arial, sans-serif;
    max-width: 500px;
    margin: 40px auto;
    background: #f4f4f4;
  }
  h2 { text-align: center; }
  .box {
    background: #fff;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }
  .input-row { display: flex; gap: 5px; }
  input { flex: 1; padding: 8px; }
  button {
    padding: 8px 12px;
    cursor: pointer;
    border: none;
    border-radius: 4px;
    color: #fff;
  }
  .add    { background: #28a745; }
  .update { background: #007bff; }
  .delete { background: #dc3545; }
  ul { list-style: none; padding: 0; margin-top: 15px; }
  li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #f9f9f9;
    padding: 8px;
    margin-bottom: 6px;
    border-radius: 4px;
  }
  .actions button { margin-left: 5px; padding: 4px 8px; font-size: 12px; }
</style>
</head>
<body>

<div class="box">
  <h2>Username</h2>

  <div class="input-row">
    <input type="text" id="usernameInput" placeholder="Enter username">
    <button id="submitBtn" class="add">Add</button>
  </div>

  <ul id="userList"></ul>
</div>

<script>
  const STORAGE_KEY = "usernames";

  // DOM references — grab once instead of re-querying every time
  const usernameInput = document.getElementById("usernameInput");
  const submitBtn = document.getElementById("submitBtn");
  const userListEl = document.getElementById("userList");

  // null = we're adding a new user; a number = we're editing that index
  let editIndex = null;

  init();

  function init() {
    submitBtn.addEventListener("click", handleSubmit);
    // let Enter key submit too, since a "normal" form would support that
    usernameInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleSubmit();
    });
    renderUsers();
  }

  // ---- storage helpers (our stand-in for a database layer) ----

  function loadUsers() {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  }

  function persistUsers(users) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(users));
  }

  // ---- CRUD actions ----

  function handleSubmit() {
    const name = usernameInput.value.trim();
    if (!name) {
      alert("Please enter a username");
      return;
    }

    const users = loadUsers();

    if (editIndex === null) {
      users.push(name);            // CREATE
    } else {
      users[editIndex] = name;     // UPDATE
      exitEditMode();
    }

    persistUsers(users);
    usernameInput.value = "";
    renderUsers();
  }

  function startEdit(index) {
    const users = loadUsers();
    usernameInput.value = users[index];
    usernameInput.focus();
    editIndex = index;
    submitBtn.textContent = "Update";
    submitBtn.classList.replace("add", "update");
  }

  function exitEditMode() {
    editIndex = null;
    submitBtn.textContent = "Add";
    submitBtn.classList.replace("update", "add");
  }

  function deleteUser(index) {
    const users = loadUsers();
    users.splice(index, 1);
    persistUsers(users);

    // if we were editing the user that just got deleted, reset the form
    if (editIndex === index) exitEditMode();
    renderUsers();
  }

  // ---- rendering ----

  function renderUsers() {
    const users = loadUsers();
    userListEl.innerHTML = "";

    users.forEach((name, index) => {
      userListEl.appendChild(createUserRow(name, index));
    });
  }

  function createUserRow(name, index) {
    const li = document.createElement("li");

    const span = document.createElement("span");
    span.textContent = name;

    const editBtn = document.createElement("button");
    editBtn.className = "update";
    editBtn.textContent = "Edit";
    editBtn.addEventListener("click", () => startEdit(index));

    const deleteBtn = document.createElement("button");
    deleteBtn.className = "delete";
    deleteBtn.textContent = "Delete";
    deleteBtn.addEventListener("click", () => deleteUser(index));

    const actions = document.createElement("div");
    actions.className = "actions";
    actions.append(editBtn, deleteBtn);

    li.append(span, actions);
    return li;
  }
</script>

</body>
</html>
